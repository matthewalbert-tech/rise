"""Gift card linked to a Rise.ai wallet."""
type RiseGiftCardSummary {
  id: String!
  code: String!
  balance: String!
  expiresAt: String
  status: String!
}

"""A single entry in a Rise.ai wallet's transaction ledger."""
type RiseWalletTransaction @dataType(name: "rise_wallet_transaction", version: "1.0") {
  id: String!
  type: String!
  amount: String!
  note: String
  createdAt: String!
}

"""Rise.ai wallet -- store credit balance, linked gift card, and loyalty identifier."""
type RiseWallet @dataType(name: "rise_wallet", version: "1.0") {
  id: String!
  balance: String!
  currency: String!
  loyaltyCardNumber: String
  giftCard: RiseGiftCardSummary
  transactions: [RiseWalletTransaction] @parentId(template: "{{.id}}")
}

type Query {
  wallet: RiseWallet
}
