"""A single entry in a Rise.ai wallet's transaction ledger."""
type RiseWalletTransaction @dataType(name: "rise_wallet_transaction", version: "1.0") {
  id: String!
  type: String!
  amount: String!
  note: String
  createdAt: String!
}

"""Rise.ai wallet -- store credit balance and loyalty identifier. Gift cards are a
separate Rise.ai object with no confirmed email-based lookup (see lookupGiftCard
action) -- not nested here."""
type RiseWallet @dataType(name: "rise_wallet", version: "1.0") {
  id: String!
  balance: String!
  currency: String!
  loyaltyCardNumber: String
  transactions: [RiseWalletTransaction] @parentId(template: "{{.id}}")
}

type Query {
  wallet: RiseWallet
}
